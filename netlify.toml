[build]
  publish = "."

[[redirects]]
  from = "https://www.ginecoactual.mx/*"
  to = "https://ginecoactual.mx/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
[[headers]]
  for = "/m2/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
